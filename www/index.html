<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>夕雅传说 - 汪夕雅的冒险</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="game-container">
    <div class="header">
      <h1 id="title">夕雅传说</h1>
    </div>
    <div class="subheader">可玩版 MVP · 自动存档 · 文字冒险</div>

    <div class="stats-bar">
      <div class="stat"><div class="stat-value" id="statLevel">1</div><div class="stat-label">等级</div></div>
      <div class="stat"><div class="stat-value" id="statHp">100</div><div class="stat-label">生命</div></div>
      <div class="stat"><div class="stat-value" id="statExp">0</div><div class="stat-label">经验</div></div>
      <div class="stat"><div class="stat-value" id="statGold">0</div><div class="stat-label">金币</div></div>
    </div>

    <div class="character-card">
      <div class="character-avatar" id="heroAvatar">👩🦰</div>
      <div class="character-name" id="heroName">汪夕雅</div>
      <div class="character-title" id="heroTitle">命运之子 · 光之继承者</div>
    </div>

    <div class="panel">
      <button class="small-btn" id="btnRestart">🔁 重开</button>
      <button class="small-btn" id="btnExport">📋 导出存档</button>
      <button class="small-btn" id="btnImport">⬇️ 导入存档</button>
    </div>

    <div class="story-box" id="story"></div>
    <div class="story-box" id="log" style="display:none"></div>

    <div class="choices" id="choices"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./story.js"></script>
  <script src="./game.js"></script>
</body>
</html>
